command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]

env:
  - name: CATALOG
    value: experian_agent_demo_catalog
  - name: SCHEMA
    value: auto
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: GENIE_SPACE_ID
    value: "01f1856aac00130baa08132c96170c4b"
  - name: ENDPOINT_RESIDUAL
    value: experian-residual-value
  - name: ENDPOINT_DTT
    value: experian-days-to-turn
  - name: ENDPOINT_DEFAULT
    value: experian-default-risk

# Resource bindings — grant the app's service principal access to these.
resources:
  - name: sql-warehouse
    description: Serverless SQL warehouse used for all Unity Catalog queries
    sql_warehouse:
      permission: CAN_USE
