# Experian Auto Intelligence Cloud: Declarative Automation Bundle (DAB)
#
# Deploys the whole demo into any Databricks workspace:
#   pipeline  experian_auto_fusion   raw Volume → Auto Loader bronze → governed gold → fusion
#   job       experian_auto_e2e      setup → generate_data → build_fusion → {sync_lakebase,
#                                    train_models → deploy_serving, create_genie_space}
#   app       Inventory & Risk Co-Pilot (FastAPI + JS), with SQL warehouse + Lakebase bindings
#
# Workspace-specific values are bundle variables. Set them in .env (see .env.example) and
# use scripts/deploy.sh, or pass --var / BUNDLE_VAR_<name> yourself.

bundle:
  name: experian_auto_intelligence

include:
  - resources/*.yml

# Only code goes to the workspace; docs, evidence and decks stay in git.
sync:
  exclude:
    - evidence/**
    - "*.pdf"
    - Experian_Auto_Intelligence_Cloud_*.md
    - scripts/**
    - scaffold/01_data/**

variables:
  catalog:
    description: Existing Unity Catalog catalog to deploy into (you need CREATE SCHEMA on it).
  schema:
    description: Schema for all tables, the raw Volume, models and functions (created if missing).
    default: experian_auto
  warehouse_id:
    description: SQL warehouse id used by the app and the Genie space.
  app_name:
    description: Databricks App name (lowercase letters, digits, hyphens; at most 30 characters).
    default: experian-copilot
  endpoint_prefix:
    description: Prefix for the three Model Serving endpoint names.
    default: experian
  genie_space_title:
    description: Title of the Genie space (the app finds the space by this title).
    default: Experian Auto Intelligence — Genie
  lakebase_project:
    description: Lakebase Autoscaling project id (scripts/deploy.sh creates it if it doesn't exist).
    default: experian-auto-oltp
  lakebase_branch:
    description: Lakebase branch id.
    default: production
  lakebase_database_id:
    description: Lakebase database resource id inside the branch (projects come with databricks-postgres).
    default: databricks-postgres
  lakebase_pg_database:
    description: Postgres database name matching lakebase_database_id.
    default: databricks_postgres
  full_access_principals:
    description: Comma-separated users / SP application ids entitled to all states at full tier (the deployer and app SP always are).
    default: ""
  tenant_contracts:
    description: 'JSON list of demo customers, e.g. [{"principal":"<sp-app-id>","customer":"Contoso Dealer Group","tier":"standard","states":["CA","NV","AZ"]}]'
    default: "[]"

targets:
  dev:
    default: true
    # Host comes from your CLI profile (DATABRICKS_CONFIG_PROFILE / -p), so no workspace
    # URL is committed. Resources are owned by, and the job runs as, the deploying user.
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
